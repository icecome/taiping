name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: 部署到 Cloudflare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 缺失密钥时立即给出明确提示，避免 wrangler 报难懂的认证错误
      - name: 校验密钥配置
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::缺少仓库 Secret:$missing"
            echo "请在 Settings → Secrets and variables → Actions → Repository secrets 中添加。"
            exit 1
          fi
          echo "密钥已配置。"

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: 单元测试
        run: pnpm -r test

      - name: 构建前端与 Worker
        run: pnpm build

      # 迁移为幂等操作，重复执行无副作用。
      # 若 API Token 缺少 D1 编辑权限，此处告警但不阻断部署，
      # 避免因权限配置问题让 Worker 无法上线。
      - name: 应用 D1 迁移
        working-directory: apps/edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if pnpm exec wrangler d1 migrations apply taiping-blog --remote; then
            echo "迁移已应用。"
          else
            echo "::warning::D1 迁移失败。若为首次部署，请确认 API Token 具备 D1 编辑权限（Account → D1 → Edit），或改用 wrangler secret/本地命令手动应用。"
          fi

      - name: 部署 Worker
        working-directory: apps/edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy 2>&1 | tee /tmp/deploy.log
        continue-on-error: false

      - name: 部署失败时输出诊断
        if: failure()
        run: |
          echo "::group::部署日志"
          cat /tmp/deploy.log 2>/dev/null || echo "(无日志)"
          echo "::endgroup::"
          echo "::error::若日志提示 authentication/permission 错误，请确认 API Token 具备以下权限："
          echo "  - Account → Workers Scripts → Edit"
          echo "  - Account → D1 → Edit（迁移步骤需要）"
          echo "  - Zone → Workers Routes → Edit（自定义域需要）"
