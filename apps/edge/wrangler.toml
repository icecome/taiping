name = "taiping-blog"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../studio/dist"
binding = "ASSETS"
not_found_handling = "none"
html_handling = "auto-trailing-slash"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "taiping-blog"
database_id = "f74e451e-b33e-40a0-8c98-686e6a437060"
migrations_dir = "migrations"

# 站点信息（标题/作者/描述/地址）不属于构建配置，
# 统一在后台「设置」中管理，存储于 D1 的 settings 表。

[triggers]
crons = ["0 * * * *"]
