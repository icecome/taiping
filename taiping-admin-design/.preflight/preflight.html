    <style id="theme-vars">
/* ==========================================================================
   Taiping Blog Admin Design System
   Style: Minimal Professional (Linear / Vercel inspired)
   Brand: Ink Monochrome - #2E2E2E primary
   ========================================================================== */

/* -- Light Mode -- */
:root {
  color-scheme: light;

  /* Brand Primary - Ink scale (neutral, one hue) */
  --color-primary-50: #FAFAFA;
  --color-primary-100: #F5F5F5;
  --color-primary-200: #E8E8E8;
  --color-primary-300: #D4D4D4;
  --color-primary-400: #A3A3A3;
  --color-primary-500: #737373;
  --color-primary-600: #525252;
  --color-primary-700: #3D3D3D;
  --color-primary-800: #2E2E2E;
  --color-primary-900: #1A1A1A;

  /* Semantic aliases */
  --background: #FAFAFA;
  --foreground: #1A1A1A;
  --card: #FFFFFF;
  --card-foreground: #1A1A1A;
  --popover: #FFFFFF;
  --popover-foreground: #1A1A1A;
  --primary: #2E2E2E;
  --primary-foreground: #FFFFFF;
  --secondary: #F5F5F5;
  --secondary-foreground: #1A1A1A;
  --muted: #F5F5F5;
  --muted-foreground: #8C8C8C;
  --border: #E8E8E8;
  --border-subtle: #F0F0F0;
  --input: #E8E8E8;
  --ring: #3B82F6;

  /* State colors - semantic status only */
  --state-success: #16A34A;
  --state-success-light: #F0FDF4;
  --state-warning: #D97706;
  --state-warning-light: #FFFBEB;
  --state-error: #DC2626;
  --state-error-light: #FEF2F2;
  --state-info: #2563EB;
  --state-info-light: #EFF6FF;

  /* Radius - restrained scale */
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --radius-full: 9999px;

  /* Typography */
  --font-sans: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI',
    'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-mono: 'SF Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace;

  /* Shadows - static surfaces border-led, floating layers allowed deeper */
  --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05), 0 1px 2px rgba(0, 0, 0, 0.03);
  --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.04), 0 2px 4px rgba(0, 0, 0, 0.03);
  --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.05), 0 4px 6px rgba(0, 0, 0, 0.03);
  --shadow-floating: 0 8px 24px rgba(0, 0, 0, 0.12), 0 2px 8px rgba(0, 0, 0, 0.08);

  /* Layout tokens */
  --sidebar-width: 240px;
  --sidebar-collapsed: 64px;
  --content-max-width: 1024px;
  --topbar-height: 52px;

  /* Scrollbar */
  --scroll-thumb: rgba(26, 26, 26, 0.18);
  --scroll-thumb-hover: rgba(26, 26, 26, 0.32);
}

/* -- Dark Mode -- */
.dark {
  color-scheme: dark;

  --color-primary-50: #1A1A1A;
  --color-primary-100: #262626;
  --color-primary-200: #2A2A2A;
  --color-primary-300: #404040;
  --color-primary-400: #525252;
  --color-primary-500: #737373;
  --color-primary-600: #A3A3A3;
  --color-primary-700: #D4D4D4;
  --color-primary-800: #E5E5E5;
  --color-primary-900: #F5F5F5;

  --background: #0F0F0F;
  --foreground: #E5E5E5;
  --card: #1A1A1A;
  --card-foreground: #E5E5E5;
  --popover: #1A1A1A;
  --popover-foreground: #E5E5E5;
  --primary: #E5E5E5;
  --primary-foreground: #0F0F0F;
  --secondary: #262626;
  --secondary-foreground: #E5E5E5;
  --muted: #262626;
  --muted-foreground: #8C8C8C;
  --border: #2A2A2A;
  --border-subtle: #222222;
  --input: #2A2A2A;
  --ring: #60A5FA;

  --state-success: #4ADE80;
  --state-success-light: #052E16;
  --state-warning: #FBBF24;
  --state-warning-light: #1C1100;
  --state-error: #F87171;
  --state-error-light: #450A0A;
  --state-info: #60A5FA;
  --state-info-light: #0A1A3A;

  --scroll-thumb: rgba(229, 229, 229, 0.16);
  --scroll-thumb-hover: rgba(229, 229, 229, 0.28);
}

/* ==========================================================================
   Base styles
   ========================================================================== */

* {
  border-color: var(--border);
}

html, body {
  height: 100%;
  margin: 0;
  padding: 0;
}

body {
  background: var(--background);
  color: var(--foreground);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: 'cv11', 'ss01', 'ss03';
}

/* Scrollbar */
.studio-scroll {
  scrollbar-width: thin;
  scrollbar-color: var(--scroll-thumb) transparent;
}
.studio-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
.studio-scroll::-webkit-scrollbar-track { background: transparent; }
.studio-scroll::-webkit-scrollbar-thumb {
  background: var(--scroll-thumb);
  border-radius: 999px;
}
.studio-scroll::-webkit-scrollbar-thumb:hover {
  background: var(--scroll-thumb-hover);
}

/* ==========================================================================
   Component utility classes
   ========================================================================== */

/* Buttons */
.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 7px 14px;
  font-size: 13px;
  font-weight: 500;
  background: var(--primary);
  color: var(--primary-foreground);
  border: 1px solid var(--primary);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: opacity 150ms ease, box-shadow 150ms ease;
}
.btn-primary:hover:not(:disabled) { opacity: 0.88; }
.btn-primary:active:not(:disabled) { transform: translateY(0.5px); }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

.btn-secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 7px 14px;
  font-size: 13px;
  font-weight: 500;
  background: var(--card);
  color: var(--foreground);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background 150ms ease, border-color 150ms ease;
}
.btn-secondary:hover:not(:disabled) {
  background: var(--muted);
  border-color: var(--color-primary-300);
}
.btn-secondary:disabled { opacity: 0.4; cursor: not-allowed; }

.btn-ghost {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 7px 12px;
  font-size: 13px;
  font-weight: 500;
  background: transparent;
  color: var(--muted-foreground);
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background 150ms ease, color 150ms ease;
}
.btn-ghost:hover:not(:disabled) {
  background: var(--muted);
  color: var(--foreground);
}

.btn-danger {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 7px 14px;
  font-size: 13px;
  font-weight: 500;
  background: var(--state-error);
  color: #FFFFFF;
  border: 1px solid var(--state-error);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: opacity 150ms ease;
}
.btn-danger:hover:not(:disabled) { opacity: 0.88; }
.btn-danger:disabled { opacity: 0.4; cursor: not-allowed; }

.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-icon { padding: 6px; width: 30px; height: 30px; }

/* Inputs */
.input-base {
  width: 100%;
  padding: 7px 12px;
  font-size: 13px;
  background: var(--card);
  color: var(--foreground);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  outline: none;
  transition: border-color 150ms ease, box-shadow 150ms ease;
}
.input-base::placeholder { color: var(--muted-foreground); }
.input-base:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.08);
}
.input-base:hover:not(:focus) { border-color: var(--color-primary-300); }

/* Navigation items */
.nav-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 12px;
  font-size: 13px;
  color: var(--muted-foreground);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background 150ms ease, color 150ms ease;
  text-decoration: none;
}
.nav-item:hover { background: var(--muted); color: var(--foreground); }
.nav-item.active {
  background: var(--muted);
  color: var(--foreground);
  font-weight: 500;
}

/* Table rows */
.row-hover { transition: background 150ms ease; }
.row-hover:hover { background: var(--muted); }

/* Badges */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  font-size: 11px;
  font-weight: 500;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--secondary);
  color: var(--foreground);
}
.badge-success { color: var(--state-success); border-color: var(--state-success); background: var(--state-success-light); }
.badge-warning { color: var(--state-warning); border-color: var(--state-warning); background: var(--state-warning-light); }
.badge-error { color: var(--state-error); border-color: var(--state-error); background: var(--state-error-light); }
.badge-muted { color: var(--muted-foreground); border-color: var(--border-subtle); background: var(--secondary); }

/* Cards */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
}

/* Focus visible */
*:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 1px;
}

    <style id="responsive-and-shared">
/* ==========================================================================
   Shared utilities (consolidated from page-level styles)
   ========================================================================== */
.nav-item-active {
  background: var(--muted);
  color: var(--foreground);
  font-weight: 500;
}
.nav-item-active:hover {
  background: var(--muted);
  color: var(--foreground);
}
.shadow-floating { box-shadow: var(--shadow-floating); }
.line-clamp-2 {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.line-clamp-3 {
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* ==========================================================================
   Mobile bottom navigation bar
   ========================================================================== */
.mobile-nav {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 56px;
  background: var(--card);
  border-top: 1px solid var(--border);
  align-items: center;
  justify-content: space-around;
  padding-bottom: env(safe-area-inset-bottom, 0);
  z-index: 50;
}
.mobile-nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 12px;
  font-size: 10px;
  color: var(--muted-foreground);
  text-decoration: none;
  transition: color 150ms ease;
}
.mobile-nav-item.active {
  color: var(--foreground);
  font-weight: 500;
}

/* ==========================================================================
   Responsive breakpoints
   Desktop (>=768px): Sidebar 240px + content
   Mobile (<768px): No sidebar, bottom nav, full-width content
   ========================================================================== */
@media (max-width: 767px) {
  /* Override inline grid-template-columns */
  .admin-shell {
    grid-template-columns: 1fr !important;
  }
  /* Hide sidebar */
  .admin-sidebar {
    display: none !important;
  }
  /* Show bottom nav */
  .mobile-nav {
    display: flex !important;
  }
  /* Adjust content padding for bottom nav space */
  .admin-main {
    padding: 12px 12px 64px !important;
  }
  /* Prevent text wrapping in header descriptions on mobile */
  .admin-desc-truncate {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 180px;
  }
  /* Status tabs: horizontal scroll on mobile */
  .admin-tabs-row {
    overflow-x: auto !important;
    flex-wrap: nowrap !important;
    -webkit-overflow-scrolling: touch;
  }
  .admin-tabs-row > * {
    white-space: nowrap !important;
    flex-shrink: 0 !important;
  }
  .admin-tabs-row > .ml-4 {
    margin-left: 1rem !important;
  }
  /* Filter row: allow wrapping but keep button on same line as last input */
  .admin-filter-row {
    flex-wrap: wrap !important;
  }
  .admin-filter-row > .admin-filter-input {
    flex: 1 1 120px !important;
    min-width: 0 !important;
  }
  .admin-filter-row > .admin-filter-select {
    flex: 0 0 auto !important;
  }
  .admin-filter-row > .admin-filter-btn {
    flex: 0 0 auto !important;
  }
  /* Stack two-column layouts */
  .responsive-grid {
    grid-template-columns: 1fr !important;
  }
  /* Comment drawer: full width on mobile */
  .comment-drawer {
    width: 100% !important;
  }
  /* Max width constraint removed on mobile */
  .admin-content {
    max-width: 100% !important;
  }
}
