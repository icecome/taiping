<!-- Shared Admin Sidebar - include in all admin pages -->
<!-- Each page should add 'nav-item-active' class to the matching nav item -->
<!-- Replace PAGE_TITLE and PAGE_DESCRIPTION per page -->

<aside class="border-r border-border bg-card flex flex-col h-full overflow-hidden" style="width:240px;flex-shrink:0;">
  <!-- Logo + Search -->
  <div class="px-4 pt-4 pb-3 border-b border-border-subtle">
    <div class="flex items-center gap-2">
      <div class="w-7 h-7 rounded-sm bg-primary flex items-center justify-center">
        <span class="text-primary-foreground text-xs font-semibold">太</span>
      </div>
      <span class="text-sm font-semibold text-foreground tracking-wide">太平后台</span>
    </div>
    <div class="mt-3 flex items-center gap-2 px-2.5 py-1.5 border border-border rounded-sm bg-secondary text-muted-foreground cursor-text">
      <i data-lucide="search" class="w-3.5 h-3.5"></i>
      <span class="text-xs">搜索...</span>
      <span class="ml-auto text-[10px] border border-border-subtle px-1 rounded-sm bg-card">Ctrl K</span>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 overflow-y-auto studio-scroll p-2 space-y-4">
    <!-- Group: 内容 -->
    <div>
      <div class="px-3 mb-1 text-[11px] uppercase tracking-wider text-muted-foreground">内容</div>
      <div class="space-y-0.5">
        <a data-dom-id="nav-dashboard" class="nav-item" href="#">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
          概览
        </a>
        <a data-dom-id="nav-post-list" class="nav-item" href="#">
          <i data-lucide="file-text" class="w-4 h-4"></i>
          文章
        </a>
        <a data-dom-id="nav-pages" class="nav-item" href="#">
          <i data-lucide="file" class="w-4 h-4"></i>
          页面
        </a>
        <a data-dom-id="nav-moments" class="nav-item" href="#">
          <i data-lucide="message-circle" class="w-4 h-4"></i>
          说说
        </a>
        <a data-dom-id="nav-comment-audit" class="nav-item" href="#">
          <i data-lucide="message-square" class="w-4 h-4"></i>
          评论
        </a>
      </div>
    </div>

    <!-- Group: 界面 -->
    <div>
      <div class="px-3 mb-1 text-[11px] uppercase tracking-wider text-muted-foreground">界面</div>
      <div class="space-y-0.5">
        <a data-dom-id="nav-taxonomy" class="nav-item" href="#">
          <i data-lucide="tags" class="w-4 h-4"></i>
          分类标签
        </a>
        <a data-dom-id="nav-theme" class="nav-item" href="#">
          <i data-lucide="palette" class="w-4 h-4"></i>
          主题
        </a>
      </div>
    </div>

    <!-- Group: 系统 -->
    <div>
      <div class="px-3 mb-1 text-[11px] uppercase tracking-wider text-muted-foreground">系统</div>
      <div class="space-y-0.5">
        <a data-dom-id="nav-media" class="nav-item" href="#">
          <i data-lucide="image" class="w-4 h-4"></i>
          媒体
        </a>
        <a data-dom-id="nav-settings" class="nav-item" href="#">
          <i data-lucide="settings" class="w-4 h-4"></i>
          设置
        </a>
        <a data-dom-id="nav-design-spec" class="nav-item" href="#">
          <i data-lucide="book-open" class="w-4 h-4"></i>
          设计规范
        </a>
      </div>
    </div>
  </nav>

  <!-- User -->
  <div class="border-t border-border-subtle px-3 py-3 flex items-center gap-2">
    <div class="w-8 h-8 rounded-sm bg-secondary border border-border flex items-center justify-center text-xs text-muted-foreground">管</div>
    <div class="min-w-0 flex-1">
      <div class="text-sm text-foreground truncate">Administrator</div>
      <div class="text-[11px] text-muted-foreground">管理员</div>
    </div>
    <button class="w-8 h-8 inline-flex items-center justify-center rounded-sm text-muted-foreground hover:text-foreground hover:bg-secondary" title="退出登录">
      <i data-lucide="log-out" class="w-4 h-4"></i>
    </button>
  </div>
</aside>
